[project]
name = "altruagent-starter"
version = "0.1.0"
description = "Starter kit for building an agent for the AltruAgent competition platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["altruagent*", "agent*"]
